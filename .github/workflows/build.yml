name: Build APK

# Build on every push to main, and whenever you click "Run workflow" in the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Allow the workflow to publish GitHub Releases (needed to attach the APK).
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compile + assemble the debug APK. This is the "loud" gate: if the code
  #    does not compile, this job fails and nothing gets published.
  # ---------------------------------------------------------------------------
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk riddle-alarm-latest.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: riddle-alarm-debug-apk
          path: riddle-alarm-latest.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Android Lint. Runs in parallel; a lint error fails the pipeline loudly.
  # ---------------------------------------------------------------------------
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Publish the fresh APK to a rolling "latest" GitHub Release, but only
  #    after BOTH build and lint pass. This guarantees we never ship a stale
  #    APK when new code is broken.
  # ---------------------------------------------------------------------------
  release:
    name: Publish to Releases
    needs: [ build, lint ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: riddle-alarm-debug-apk

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT_SHA=$(git rev-parse --short HEAD)
          NOTES="Automatic debug build from commit ${SHORT_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC').

          **How to install:** download \`riddle-alarm-latest.apk\` below on your phone and open it. You may need to allow your browser to install unknown apps (see the README)."
          # Remove the previous rolling release + tag so 'latest' always points at this commit.
          gh release delete latest --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest riddle-alarm-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build ($SHORT_SHA)" \
            --notes "$NOTES" \
            --latest
